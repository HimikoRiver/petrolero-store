<svg xmlns="http://www.w3.org/2000/svg" width="490" height="332" viewBox="0 0 490 332" fill="none" role="img" aria-label="Три золотые вращающиеся шестерни">
  <title>Золотой механизм Petrolero</title>
  <desc>Три соприкасающиеся шестерни вращаются в согласованных направлениях. Фон прозрачный.</desc>
  <defs>
    <linearGradient id="gold-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d0"/>
      <stop offset=".14" stop-color="#e9bf75"/>
      <stop offset=".37" stop-color="#b9792e"/>
      <stop offset=".53" stop-color="#f3d193"/>
      <stop offset=".73" stop-color="#c58a43"/>
      <stop offset="1" stop-color="#86531e"/>
    </linearGradient>
    <linearGradient id="gold-amber" x1=".08" y1="0" x2=".89" y2="1">
      <stop offset="0" stop-color="#fff3ca"/>
      <stop offset=".24" stop-color="#dba35a"/>
      <stop offset=".46" stop-color="#9c6122"/>
      <stop offset=".67" stop-color="#f2cb86"/>
      <stop offset="1" stop-color="#ae6929"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0" y1="0" x2="1" y2=".92">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".24" stop-color="#dca861"/>
      <stop offset=".48" stop-color="#ac732c"/>
      <stop offset=".7" stop-color="#f6d89b"/>
      <stop offset="1" stop-color="#996124"/>
    </linearGradient>
    <filter id="metal-shadow" x="-24%" y="-24%" width="148%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <style>
    .gear { transform-box: fill-box; transform-origin: center; }
    .gear--large { animation: spin-clockwise 26s linear infinite; }
    .gear--medium { animation: spin-counterclockwise 16s linear infinite; }
    .gear--small { animation: spin-clockwise 12s linear infinite; }
    @keyframes spin-clockwise { to { transform: rotate(360deg); } }
    @keyframes spin-counterclockwise { to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
  </style>
  
