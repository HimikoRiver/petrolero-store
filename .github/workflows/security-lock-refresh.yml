name: Security Lockfile Refresh (one-time)

on:
  push:
    branches:
      - feature/storefront-catalog
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve patched packages without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate resolved production packages
        run: npm audit --omit=dev --audit-level=high
      - name: Install verified lockfile and run application checks
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx next typegen
          npx tsc --noEmit
          npm run build
      - name: Commit reviewed lockfile changes to storefront branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "Refresh audited lockfile for Next, Nodemailer and pinned safe transitives"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH_HEADER" fetch origin feature/storefront-catalog
          git -c core.hooksPath=/dev/null rebase FETCH_HEAD
          git -c core.hooksPath=/dev/null -c http.extraheader="$AUTH_HEADER" push origin HEAD:feature/storefront-catalog
