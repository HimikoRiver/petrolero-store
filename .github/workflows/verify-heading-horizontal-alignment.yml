name: Verify horizontal heading alignment
on:
  push:
    branches:
      - feature/liquid-intro-prototype
    paths:
      - .github/workflows/verify-heading-horizontal-alignment.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate types
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
