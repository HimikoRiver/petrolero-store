name: Update patched Next.js dependencies

on:
  push:
    branches:
      - feature/liquid-intro-prototype
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Recreate lockfile using the official npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile has patched Next.js
        run: |
          node -e "const p=require('./package-lock.json');for(const n of ['node_modules/next','node_modules/eslint-config-next']){if(p.packages[n]?.version!=='16.4.3')throw Error(n+' is '+p.packages[n]?.version)}"
      - name: Commit regenerated package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for patched Next.js 16.4.3"
            git push origin HEAD:${{ github.ref_name }}
          fi
